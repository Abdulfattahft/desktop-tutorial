name: Build and Deploy Baynana Web

on:
  push:
    branches:
      - main
      - baynana-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: baynana-web-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        run: |
          flutter build web --release \
            --web-renderer html \
            --base-href "/desktop-tutorial/" \
            --pwa-strategy=none \
            --source-maps \
            --dart-define=USE_PATH_URL_STRATEGY=false

      - name: Cache-bust Flutter entry files
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          revision = os.environ['REVISION']
          root = pathlib.Path('build/web')

          bootstrap = root / 'flutter_bootstrap.js'
          bootstrap_text = bootstrap.read_text(encoding='utf-8')
          bootstrap_text = bootstrap_text.replace(
              'main.dart.js', f'main.dart.js?revision={revision}'
          )
          bootstrap.write_text(bootstrap_text, encoding='utf-8')

          index = root / 'index.html'
          index_text = index.read_text(encoding='utf-8')
          index_text = re.sub(
              r'flutter_bootstrap\.js(?:\?[^"\']*)?',
              f'flutter_bootstrap.js?revision={revision}',
              index_text,
          )
          index.write_text(index_text, encoding='utf-8')
          PY

      - name: Install WebKit test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.50.1
          npx playwright install --with-deps webkit

      - name: Verify real login screen in iPhone WebKit
        run: |
          mkdir -p .smoke/desktop-tutorial
          cp -R build/web/. .smoke/desktop-tutorial/

          python3 -m http.server 4173 --directory .smoke >/tmp/baynana-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/desktop-tutorial/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const fs = require('fs');
          const { webkit, devices } = require('playwright');

          (async () => {
            const pageErrors = [];
            const consoleErrors = [];
            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({
              ...devices['iPhone 15 Pro'],
              locale: 'ar-SA',
              colorScheme: 'light',
            });
            const page = await context.newPage();

            page.on('pageerror', (error) => {
              pageErrors.push(error.stack || error.message || String(error));
            });
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            let navigationError = null;
            try {
              await page.goto('http://127.0.0.1:4173/desktop-tutorial/', {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              await page.waitForFunction(
                () => document.documentElement.dataset.baynanaScreen === 'login',
                null,
                { timeout: 60000 },
              );
            } catch (error) {
              navigationError = error.stack || error.message || String(error);
            }

            await page.waitForTimeout(2000);

            const state = await page.evaluate(() => ({
              ready: document.documentElement.dataset.baynanaReady || null,
              screen: document.documentElement.dataset.baynanaScreen || null,
              loadingVisible: Boolean(document.getElementById('baynana-loading')),
              bodyText: document.body.innerText.slice(0, 3000),
              bodyHtml: document.body.innerHTML.slice(0, 5000),
            }));

            const surface = page.locator('flutter-view, flt-glass-pane').first();
            const surfaceCount = await surface.count();
            const box = surfaceCount ? await surface.boundingBox() : null;
            const viewport = page.viewportSize();
            const widthOk = Boolean(box && viewport && box.width >= viewport.width * 0.95);
            const heightOk = Boolean(box && viewport && box.height >= viewport.height * 0.90);
            const passed =
              !navigationError &&
              state.ready === 'true' &&
              state.screen === 'login' &&
              !state.loadingVisible &&
              pageErrors.length === 0 &&
              widthOk &&
              heightOk;

            const diagnostic = {
              commit: process.env.GITHUB_SHA,
              passed,
              navigationError,
              state,
              pageErrors,
              consoleErrors,
              box,
              viewport,
              widthOk,
              heightOk,
            };

            fs.writeFileSync(
              '/tmp/baynana-diagnostic.txt',
              '```json\n' + JSON.stringify(diagnostic, null, 2) + '\n```\n',
            );

            if (!passed) {
              console.error('Baynana real-screen verification failed.');
              console.error(JSON.stringify(diagnostic, null, 2));
              await page.screenshot({
                path: 'baynana-webkit-startup-error.png',
                fullPage: true,
              });
              await browser.close();
              process.exit(1);
            }

            console.log('Verified the real Baynana login screen in iPhone WebKit.');
            await browser.close();
          })().catch((error) => {
            fs.writeFileSync(
              '/tmp/baynana-diagnostic.txt',
              'Unexpected smoke-test failure:\n\n```\n' +
                (error.stack || String(error)) +
                '\n```\n',
            );
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Upload failed startup screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baynana-web-startup-diagnostic-${{ github.sha }}
          path: |
            baynana-webkit-startup-error.png
            /tmp/baynana-diagnostic.txt
          if-no-files-found: ignore

      - name: Create diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/baynana-diagnostic.txt ]; then
            printf 'The workflow failed before the browser diagnostic was generated.\n\nCommit: `%s`\n' "$GITHUB_SHA" > /tmp/baynana-diagnostic.txt
          fi
          gh issue create \
            --title "Web startup diagnostic ${GITHUB_SHA:0:8}" \
            --body-file /tmp/baynana-diagnostic.txt || true

      - name: Add GitHub Pages fallback and deployment marker
        run: |
          cp build/web/index.html build/web/404.html
          printf '%s' "$GITHUB_SHA" > build/web/deploy-version.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERSION_URL: ${{ steps.deployment.outputs.page_url }}deploy-version.txt
        run: |
          echo "Waiting for GitHub Pages to serve ${EXPECTED_SHA}"
          for attempt in {1..18}; do
            DEPLOYED_SHA="$(curl -fsSL "${VERSION_URL}?revision=${EXPECTED_SHA}" || true)"
            if [ "${DEPLOYED_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "Verified deployed revision: ${DEPLOYED_SHA}"
              exit 0
            fi
            echo "Attempt ${attempt}/18: deployed='${DEPLOYED_SHA:-unavailable}'"
            sleep 10
          done

          echo "::error::GitHub Pages did not serve the expected revision ${EXPECTED_SHA}."
          exit 1
