name: Build and Deploy Baynana Web

on:
  push:
    branches:
      - main
      - baynana-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: baynana-web-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        run: |
          flutter build web --release \
            --base-href "/desktop-tutorial/" \
            --pwa-strategy=none \
            --no-wasm-dry-run \
            --dart-define=USE_PATH_URL_STRATEGY=false

      - name: Add GitHub Pages fallback and deployment marker
        run: |
          cp build/web/index.html build/web/404.html
          printf '%s' "$GITHUB_SHA" > build/web/deploy-version.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERSION_URL: ${{ steps.deployment.outputs.page_url }}deploy-version.txt
        run: |
          echo "Waiting for GitHub Pages to serve ${EXPECTED_SHA}"
          for attempt in {1..18}; do
            DEPLOYED_SHA="$(curl -fsSL "${VERSION_URL}?revision=${EXPECTED_SHA}" || true)"
            if [ "${DEPLOYED_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "Verified deployed revision: ${DEPLOYED_SHA}"
              exit 0
            fi
            echo "Attempt ${attempt}/18: deployed='${DEPLOYED_SHA:-unavailable}'"
            sleep 10
          done

          echo "::error::GitHub Pages did not serve the expected revision ${EXPECTED_SHA}."
          exit 1
