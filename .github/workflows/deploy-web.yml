name: Build and Deploy Baynana Web

on:
  push:
    branches:
      - main
      - baynana-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: baynana-web-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        run: |
          flutter build web --release \
            --base-href "/desktop-tutorial/" \
            --pwa-strategy=none \
            --no-wasm-dry-run \
            --source-maps \
            --dart-define=USE_PATH_URL_STRATEGY=false

      - name: Cache-bust Flutter entry files
        env:
          REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          revision = os.environ['REVISION']
          root = pathlib.Path('build/web')

          bootstrap = root / 'flutter_bootstrap.js'
          bootstrap_text = bootstrap.read_text(encoding='utf-8')
          bootstrap_text = bootstrap_text.replace(
              'main.dart.js', f'main.dart.js?revision={revision}'
          )
          bootstrap.write_text(bootstrap_text, encoding='utf-8')

          index = root / 'index.html'
          index_text = index.read_text(encoding='utf-8')
          index_text = re.sub(
              r'flutter_bootstrap\.js(?:\?[^"\']*)?',
              f'flutter_bootstrap.js?revision={revision}',
              index_text,
          )
          index.write_text(index_text, encoding='utf-8')
          PY

      - name: Browser startup smoke test
        run: |
          mkdir -p .smoke/desktop-tutorial
          cp -R build/web/. .smoke/desktop-tutorial/

          python3 -m http.server 4173 --directory .smoke >/tmp/baynana-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/desktop-tutorial/ >/dev/null; then
              break
            fi
            sleep 1
          done

          npm install --no-save --no-package-lock playwright-core@1.50.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN

          node <<'NODE'
          const { chromium } = require('playwright-core');

          (async () => {
            const errors = [];
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            const page = await browser.newPage({
              viewport: { width: 430, height: 760 },
              userAgent:
                'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
            });

            page.on('pageerror', (error) => {
              errors.push(error.stack || error.message || String(error));
            });

            await page.goto('http://127.0.0.1:4173/desktop-tutorial/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(12000);

            const bodyText = await page.locator('body').innerText();
            const startupScreen = bodyText.includes('تعذر تشغيل تطبيق بيننا');

            if (startupScreen || errors.length > 0) {
              console.error('Baynana startup smoke test failed.');
              console.error(bodyText);
              console.error(errors.join('\n\n'));
              await page.screenshot({ path: 'baynana-startup-error.png', fullPage: true });
              await browser.close();
              process.exit(1);
            }

            console.log('Baynana opened without an uncaught startup error.');
            await browser.close();
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Add GitHub Pages fallback and deployment marker
        run: |
          cp build/web/index.html build/web/404.html
          printf '%s' "$GITHUB_SHA" > build/web/deploy-version.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERSION_URL: ${{ steps.deployment.outputs.page_url }}deploy-version.txt
        run: |
          echo "Waiting for GitHub Pages to serve ${EXPECTED_SHA}"
          for attempt in {1..18}; do
            DEPLOYED_SHA="$(curl -fsSL "${VERSION_URL}?revision=${EXPECTED_SHA}" || true)"
            if [ "${DEPLOYED_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "Verified deployed revision: ${DEPLOYED_SHA}"
              exit 0
            fi
            echo "Attempt ${attempt}/18: deployed='${DEPLOYED_SHA:-unavailable}'"
            sleep 10
          done

          echo "::error::GitHub Pages did not serve the expected revision ${EXPECTED_SHA}."
          exit 1
