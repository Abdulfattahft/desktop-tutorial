name: baynana
description: "بيننا — تطبيق للمخطوبين والأزواج في مدن مختلفة"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # إدارة الحالة (MVVM)
  provider: ^6.1.2

  # التوجيه
  go_router: ^14.3.0

  # واجهات وأدوات
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0        # رسوم متحركة خفيفة
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1  # مسح ذاكرة الصور المؤقتة من الإعدادات
  image_picker: ^1.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  confetti: ^0.8.0               # احتفالات عند الإنجازات
  share_plus: ^10.0.2            # مشاركة رمز الدعوة
  http: ^1.2.2                   # استدعاء Cloud Function للذكاء الاصطناعي

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # لتوليد ملفات الترجمة تلقائيًا

  assets:
    - assets/images/
    - assets/icons/
