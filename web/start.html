<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/desktop-tutorial/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F6">
  <meta name="description" content="بيننا — مساحة تجمعكما">
  <title>بيننا</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff9f6;
    }

    #baynana-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff9f6;
      color: #8f3f5c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      transition: opacity 180ms ease;
    }

    #baynana-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .baynana-loading-card {
      padding: 24px;
      font-size: 18px;
      font-weight: 700;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
  </style>
</head>
<body>
  <div id="baynana-loading">
    <div class="baynana-loading-card">جاري تشغيل بيننا…</div>
  </div>

  <script>
    const baynanaRevision = '__BUILD_REVISION__';
    document.documentElement.dataset.baynanaRevision = baynanaRevision;

    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations.map((registration) => registration.unregister()),
          );
        }

        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
      } catch (error) {
        console.warn('Baynana cache cleanup skipped:', error);
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?revision=${encodeURIComponent(baynanaRevision)}`;
      bootstrap.async = true;
      bootstrap.onerror = () => {
        const loading = document.getElementById('baynana-loading');
        if (loading) loading.textContent = 'تعذر تحميل التطبيق. أعد فتح الرابط.';
      };
      document.body.appendChild(bootstrap);

      const hideLoadingWhenFlutterAppears = () => {
        const flutterSurface = document.querySelector('flutter-view, flt-glass-pane');
        if (!flutterSurface) return false;
        const loading = document.getElementById('baynana-loading');
        if (loading) {
          loading.classList.add('hidden');
          setTimeout(() => loading.remove(), 250);
        }
        return true;
      };

      if (!hideLoadingWhenFlutterAppears()) {
        const observer = new MutationObserver(() => {
          if (hideLoadingWhenFlutterAppears()) observer.disconnect();
        });
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      }
    })();
  </script>
</body>
</html>
