<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="بيننا — مساحة رقمية رومانسية للأزواج والمخطوبين: ألعاب، تحديات، ذكريات وهدايا.">
  <meta name="theme-color" content="#B85C7A">
  <meta property="og:type" content="website">
  <meta property="og:title" content="بيننا">
  <meta property="og:description" content="كل ما يجمعكما في مكان واحد.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>بيننا | مساحة تجمعكما</title>
</head>
<body>
  <noscript>يحتاج موقع بيننا إلى تفعيل JavaScript.</noscript>

  <script>
    // Each deployment replaces this placeholder with its Git commit SHA.
    // The revision is also appended to Flutter entry files so Safari cannot
    // reuse a JavaScript bundle from an older layout.
    const baynanaRevision = '__BUILD_REVISION__';
    document.documentElement.dataset.baynanaRevision = baynanaRevision;

    (async () => {
      const resetKey = `baynana-cache-reset-${baynanaRevision}`;

      try {
        if (!sessionStorage.getItem(resetKey)) {
          const wasControlled = Boolean(
            'serviceWorker' in navigator && navigator.serviceWorker.controller,
          );

          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }

          sessionStorage.setItem(resetKey, 'true');

          // A page already controlled by the old Flutter service worker must
          // navigate once after unregistering before loading the new bundle.
          if (wasControlled) {
            const url = new URL(window.location.href);
            url.searchParams.set('revision', baynanaRevision);
            window.location.replace(url.toString());
            return;
          }
        }
      } catch (error) {
        console.warn('Baynana cache cleanup skipped:', error);
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?revision=${encodeURIComponent(baynanaRevision)}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
