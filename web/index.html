<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="بيننا — مساحة رقمية رومانسية للأزواج والمخطوبين: ألعاب، تحديات، ذكريات وهدايا.">
  <meta name="theme-color" content="#1E1A19">
  <meta property="og:type" content="website">
  <meta property="og:title" content="بيننا">
  <meta property="og:description" content="كل ما يجمعكما في مكان واحد.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>بيننا | مساحة تجمعكما</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1E1A19;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    #baynana-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #1E1A19;
      color: #FFFFFF;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    #baynana-loading-card {
      width: min(420px, 100%);
      padding: 30px 24px;
      border-radius: 24px;
      background: #2A2422;
      border: 1px solid #6D4A4A;
    }

    #baynana-loading-heart {
      font-size: 48px;
      line-height: 1;
      animation: baynanaPulse 1.1s ease-in-out infinite;
    }

    #baynana-loading-title {
      margin: 18px 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    #baynana-loading-message {
      margin: 0;
      color: #DDD2CE;
      font-size: 16px;
      line-height: 1.7;
    }

    #baynana-reload {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 14px;
      background: #E79AA8;
      color: #FFFFFF;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes baynanaPulse {
      0%, 100% { transform: scale(1); opacity: .75; }
      50% { transform: scale(1.13); opacity: 1; }
    }
  </style>
</head>
<body>
  <noscript>يحتاج موقع بيننا إلى تفعيل JavaScript.</noscript>

  <div id="baynana-loading" role="status" aria-live="polite">
    <div id="baynana-loading-card">
      <div id="baynana-loading-heart">💕</div>
      <h1 id="baynana-loading-title">بيننا</h1>
      <p id="baynana-loading-message">جاري تشغيل التطبيق…</p>
      <button id="baynana-reload" type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('baynana-loading');
      var message = document.getElementById('baynana-loading-message');
      var reload = document.getElementById('baynana-reload');

      function finishLoading() {
        document.documentElement.dataset.baynanaReady = 'true';
        if (loading) loading.remove();
      }

      window.addEventListener('baynana-ready', finishLoading, { once: true });

      window.setTimeout(function () {
        if (document.documentElement.dataset.baynanaReady === 'true') return;
        if (message) {
          message.textContent = 'استغرق تشغيل التطبيق وقتًا أطول من المتوقع. تحقق من الاتصال ثم أعد المحاولة.';
        }
        if (reload) reload.style.display = 'block';
      }, 30000);
    })();
  </script>

  <script src="flutter_bootstrap.js?v=17" defer></script>
</body>
</html>
